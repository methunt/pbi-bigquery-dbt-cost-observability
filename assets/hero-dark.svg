<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 186" width="1200" height="186" role="img" aria-label="BigQuery and dbt Cost Observability">
  <style>
    /* Entrance animations move things but never fade them. A renderer that does
       not run CSS - GitHub's mobile app, an email digest, a PDF export - would
       otherwise show an empty banner, because the from-state of a fade is
       invisible and fill-mode `both` holds it for the whole delay. Every element
       here is fully legible with the animation stripped out. */
    .rise { animation: rise .55s cubic-bezier(.2,.7,.3,1) both; }
    .rule { animation: sweep .9s cubic-bezier(.2,.7,.3,1) .15s; }
    .blob { animation: drift 14s ease-in-out infinite alternate; }
    @keyframes rise { from { transform: translateY(9px) }
                       to   { transform: translateY(0) } }
    @keyframes sweep { from { width: 0 } to { width: 1120px } }
    @keyframes drift { from { transform: translate(0,0) } to { transform: translate(64px,-22px) } }
    @media (prefers-reduced-motion: reduce) {
      .rise,.rule,.blob { animation: none }
    }
  </style>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="186" rx="16" fill="#161B22"/>
  <rect x="0.5" y="0.5" width="1199" height="185" rx="15.5" fill="none" stroke="#30363D"/>
  <rect width="8" height="186" rx="4" fill="#3B82F6"/>
  <g class="blob"><circle cx="1010" cy="70" r="240" fill="url(#glow)"/></g>

  <g class="rise">
    <text x="40" y="74" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="700"
          letter-spacing="3" fill="#3B82F6">BIGQUERY  ⇄  DBT</text>
  </g>
  <rect class="rule" x="40" y="108" width="1120" height="2" rx="1" fill="#30363D"/>
  <g class="rise" style="animation-delay:.2s">
    <text x="40" y="146" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="25"
          fill="#8B949E">Two halves: what the whole warehouse costs, and what dbt costs inside it.</text>
  </g>
</svg>
