<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 162" width="1200" height="162" role="img" aria-label="PART 3 - Run it yourself">
  <style>
    /* Same rule as the hero: entrance animations only ever move things. The
       resting state of every element is its final state, so the banner is fully
       legible in a renderer that ignores CSS. */
    /* The glyph is drawn centred on its own origin, so scaling about 0 0 scales
       about its centre. Left as the CSS default of 50% 50% the reference box
       differs between renderers and the glyph drifts as it scales. */
    .glyph { animation: pop .5s cubic-bezier(.2,.8,.3,1); transform-origin: 0 0 }
    .txt { animation: slidein .45s ease-out both }
    .chip { animation: slidein .4s ease-out both }
    .edge { animation: stretch .7s cubic-bezier(.2,.7,.3,1) }
    @keyframes pop { from { transform: scale(.82) } to { transform: scale(1) } }
    @keyframes slidein { from { transform: translateX(-10px) }
                          to   { transform: translateX(0) } }
    @keyframes stretch { from { height: 0 } to { height: 162px } }
    @media (prefers-reduced-motion: reduce) {
      .glyph,.txt,.chip,.edge { animation: none }
    }
  </style>
  <defs>
    <linearGradient id="wash" x1="0" x2="1">
      <stop offset="0%"   stop-color="#10B981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="162" fill="#0D1117"/>
  <rect width="640" height="162" fill="url(#wash)"/>
  <rect class="edge" x="0" y="0" width="6" height="162" fill="#10B981"/>

  <!-- Two nested groups on purpose. A CSS `transform` in the animation would
       override the SVG transform attribute on the same element, so animating
       scale on the positioned group snaps the glyph to the origin. The outer
       group positions, the inner one animates. -->
  <g transform="translate(52,58)">
    <g class="glyph">
    <circle cx="0" cy="0" r="16" fill="none" stroke="#10B981" stroke-width="4"/>
    <path d="M -5.5 -8 L 9 0 L -5.5 8 Z" fill="#10B981"/></g>
  </g>

  <g class="txt">
    <text x="92" y="42" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700"
          fill="#10B981" letter-spacing="2">PART 3</text>
  </g>
  <g class="txt" style="animation-delay:.06s">
    <text x="92" y="74" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="27" font-weight="700"
          fill="#E6EDF3" letter-spacing="-0.5">Run it yourself</text>
  </g>
  <g class="txt" style="animation-delay:.12s">
    <text x="92" y="98" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5"
          fill="#8B949E">Clone it, point it at the sample data or your own BigQuery, and refresh.</text>
  </g>

  <g class="txt" style="animation-delay:.18s">
    <rect x="1025" y="34" width="139" height="26" rx="13"
          fill="#10B981" fill-opacity="0.14" stroke="#10B981" stroke-opacity="0.45"/>
    <text x="1095" y="51" text-anchor="middle"
          font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600"
          fill="#10B981">offline by default</text>
  </g>

  <g class="chip" style="animation-delay:0.30s">
    <rect x="92" y="112" width="91" height="27" rx="13.5"
          fill="#161B22" stroke="#30363D"/>
    <circle cx="105" cy="125.5" r="3.5" fill="#10B981"/>
    <text x="116" y="130" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12"
          fill="#8B949E">Quickstart</text>
  </g>
  <g class="chip" style="animation-delay:0.39s">
    <rect x="192" y="112" width="91" height="27" rx="13.5"
          fill="#161B22" stroke="#30363D"/>
    <circle cx="205" cy="125.5" r="3.5" fill="#10B981"/>
    <text x="216" y="130" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12"
          fill="#8B949E">Parameters</text>
  </g>
  <g class="chip" style="animation-delay:0.48s">
    <rect x="292" y="112" width="112" height="27" rx="13.5"
          fill="#161B22" stroke="#30363D"/>
    <circle cx="305" cy="125.5" r="3.5" fill="#10B981"/>
    <text x="316" y="130" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12"
          fill="#8B949E">Prerequisites</text>
  </g>
</svg>
