<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 196" width="1200" height="196" role="img" aria-label="PART 1 - Query &amp; Usage Insights">
  <style>
    /* Same rule as the hero: entrance animations only ever move things. The
       resting state of every element is its final state, so the banner is fully
       legible in a renderer that ignores CSS. */
    /* The glyph is drawn centred on its own origin, so scaling about 0 0 scales
       about its centre. Left as the CSS default of 50% 50% the reference box
       differs between renderers and the glyph drifts as it scales. */
    .glyph { animation: pop .5s cubic-bezier(.2,.8,.3,1); transform-origin: 0 0 }
    .txt { animation: slidein .45s ease-out both }
    .chip { animation: slidein .4s ease-out both }
    .edge { animation: stretch .7s cubic-bezier(.2,.7,.3,1) }
    @keyframes pop { from { transform: scale(.82) } to { transform: scale(1) } }
    @keyframes slidein { from { transform: translateX(-10px) }
                          to   { transform: translateX(0) } }
    @keyframes stretch { from { height: 0 } to { height: 196px } }
    @media (prefers-reduced-motion: reduce) {
      .glyph,.txt,.chip,.edge { animation: none }
    }
  </style>
  <defs>
    <linearGradient id="wash" x1="0" x2="1">
      <stop offset="0%"   stop-color="#2563EB" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="196" fill="#FFFFFF"/>
  <rect width="640" height="196" fill="url(#wash)"/>
  <rect class="edge" x="0" y="0" width="6" height="196" fill="#2563EB"/>

  <!-- Two nested groups on purpose. A CSS `transform` in the animation would
       override the SVG transform attribute on the same element, so animating
       scale on the positioned group snaps the glyph to the origin. The outer
       group positions, the inner one animates. -->
  <g transform="translate(52,70)">
    <g class="glyph">
    <circle cx="0" cy="-3" r="15" fill="none" stroke="#2563EB" stroke-width="4"/>
    <line x1="11" y1="8" x2="21" y2="18" stroke="#2563EB" stroke-width="5"
          stroke-linecap="round"/></g>
  </g>

  <g class="txt">
    <text x="92" y="46" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700"
          fill="#2563EB" letter-spacing="2">PART 1</text>
  </g>
  <g class="txt" style="animation-delay:.06s">
    <text x="92" y="86" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="31" font-weight="700"
          fill="#1F2328" letter-spacing="-0.5">Query &amp; Usage Insights</text>
  </g>
  <g class="txt" style="animation-delay:.12s">
    <text x="92" y="116" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17.5"
          fill="#656D76">Every BigQuery job - who spends, on what, how long, and how much was cache.</text>
  </g>

  <g class="txt" style="animation-delay:.18s">
    <rect x="1014" y="36" width="150" height="32" rx="16"
          fill="#2563EB" fill-opacity="0.14" stroke="#2563EB" stroke-opacity="0.45"/>
    <text x="1089" y="57" text-anchor="middle"
          font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600"
          fill="#2563EB">no dbt required</text>
  </g>

  <g class="chip" style="animation-delay:0.30s">
    <rect x="92" y="132" width="198" height="33" rx="16.5"
          fill="#F6F8FA" stroke="#D0D7DE"/>
    <circle cx="107" cy="148.5" r="4" fill="#2563EB"/>
    <text x="120" y="154" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5"
          fill="#656D76">Performance Analysis</text>
  </g>
  <g class="chip" style="animation-delay:0.39s">
    <rect x="299" y="132" width="86" height="33" rx="16.5"
          fill="#F6F8FA" stroke="#D0D7DE"/>
    <circle cx="314" cy="148.5" r="4" fill="#2563EB"/>
    <text x="327" y="154" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5"
          fill="#656D76">Explore</text>
  </g>
  <g class="chip" style="animation-delay:0.48s">
    <rect x="394" y="132" width="250" height="33" rx="16.5"
          fill="#F6F8FA" stroke="#D0D7DE"/>
    <circle cx="409" cy="148.5" r="4" fill="#2563EB"/>
    <text x="422" y="154" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5"
          fill="#656D76">Query pattern drillthrough</text>
  </g>
</svg>
