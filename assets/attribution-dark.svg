<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 372" width="1200" height="372" role="img" aria-label="How dbt spend is attributed across three branches">
  <style>
    /* The bar's resting width is its real width, and the animation grows into it.
       Written the other way round - base width 0, filled in by the animation - a
       renderer that skips CSS shows three empty tracks. */
    .row { animation: slide .5s ease-out both; }
    .bar { width: var(--w); animation: grow .85s cubic-bezier(.2,.7,.3,1); }
    @keyframes slide { from { transform: translateX(-8px) }
                        to   { transform: translateX(0) } }
    @keyframes grow { from { width: 0 } to { width: var(--w) } }
    @media (prefers-reduced-motion: reduce) {
      .row,.bar { animation: none }
    }
  </style>
  <rect width="1200" height="372" fill="#0D1117"/>
  <text x="36" y="36" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="600"
        fill="#484F58" letter-spacing="1.4">WHERE THE dbt BILL COMES FROM</text>
  <text x="36" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17.5" fill="#8B949E">
    $470.60 of dbt spend, split by how confidently each job ties back to a node.
  </text>

  <g class="row" style="animation-delay:0.15s">
    <text x="36" y="106" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="600"
          fill="#E6EDF3">Node (dbt metadata)</text>
    <text x="36" y="130" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15"
          fill="#8B949E">matched to a recorded node execution by job id</text>
    <rect x="420" y="90" width="560" height="24" rx="6" fill="#21262D"/>
    <rect class="bar" style="animation-delay:0.30s;--w:560px"
          x="420" y="90" height="24" rx="6" fill="#10B981"/>
    <text x="1164" y="106" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="16.5"
          font-weight="600" fill="#E6EDF3">$380.74</text>
    <text x="1164" y="130" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="15"
          fill="#8B949E">80.9%  ·  2,577 jobs</text>
  </g>
  <g class="row" style="animation-delay:0.29s">
    <text x="36" y="192" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="600"
          fill="#E6EDF3">Node (label)</text>
    <text x="36" y="216" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15"
          fill="#8B949E">post-hook jobs dbt never records - labels only</text>
    <rect x="420" y="176" width="560" height="24" rx="6" fill="#21262D"/>
    <rect class="bar" style="animation-delay:0.44s;--w:132px"
          x="420" y="176" height="24" rx="6" fill="#F59E0B"/>
    <text x="1164" y="192" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="16.5"
          font-weight="600" fill="#E6EDF3">$89.70</text>
    <text x="1164" y="216" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="15"
          fill="#8B949E">19.1%  ·  161 jobs</text>
  </g>
  <g class="row" style="animation-delay:0.43s">
    <text x="36" y="278" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="600"
          fill="#E6EDF3">Run-level</text>
    <text x="36" y="302" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15"
          fill="#8B949E">a dbt run with no identifiable node</text>
    <rect x="420" y="262" width="560" height="24" rx="6" fill="#21262D"/>
    <rect class="bar" style="animation-delay:0.58s;--w:3px"
          x="420" y="262" height="24" rx="6" fill="#484F58"/>
    <text x="1164" y="278" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="16.5"
          font-weight="600" fill="#E6EDF3">$0.16</text>
    <text x="1164" y="302" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="15"
          fill="#8B949E">0.0%  ·  41 jobs</text>
  </g>
  <rect x="36" y="322" width="1128" height="1" fill="#30363D"/>
  <text x="36" y="352" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#8B949E">
    Drop the label branch and $89.70 of the bill - 19.1% - becomes unattributable. That is the case for this model.
  </text>
</svg>
