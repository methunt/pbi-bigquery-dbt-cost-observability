          font-weight="600" fill="#1F2328">Report</text>
    <text x="974" y="200" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#656D76">Query &amp; Usage Insights</text><text x="974" y="217" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#656D76">DBT Jobs</text><text x="974" y="234" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#656D76">DBT Jobs · Nodes Failed</text><text x="974" y="251" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#656D76">two Explore tabs</text><text x="974" y="268" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#656D76"></text><text x="974" y="285" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#656D76">drillthrough + tooltip pages</text>
  </g>
  <text x="366" y="326" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10" fill="#8C959F">
    p_DataSource = "SampleCSV" | "BigQuery"
