    <rect x="366" y="150" width="214" height="3" rx="1.5" fill="#0891B2"/>
    <text x="382" y="178" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13"
          font-weight="600" fill="#1F2328">Power Query</text>
    <text x="382" y="200" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#656D76">p_DataSource switches</text><text x="382" y="217" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#656D76">every partition between</text><text x="382" y="234" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#656D76">BigQuery and CSV.</text><text x="382" y="251" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#656D76"></text><text x="382" y="268" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#656D76">Types stated per table -</text><text x="382" y="285" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#656D76">CSV carries none.</text>
  </g>
  <g class="node">
    <rect x="654" y="128" width="236" height="194" rx="10" fill="#F6F8FA"
          stroke="#D0D7DE"/>
    <rect x="654" y="128" width="236" height="3" rx="1.5" fill="#D97706"/>
    <text x="670" y="156" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13"
          font-weight="600" fill="#1F2328">Semantic model</text>
    <text x="670" y="178" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#656D76">Fact  ← one row per job</text><text x="670" y="195" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#656D76">dbt_node_executions</text><text x="670" y="212" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#656D76">dbt_invocations · dbt_models</text><text x="670" y="229" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#656D76">dim_Date · dim_Region_Cost</text><text x="670" y="246" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#656D76"></text><text x="670" y="263" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#656D76">cost restricted to top-level</text><text x="670" y="280" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#656D76">jobs (parent_job_id BLANK)</text><text x="670" y="297" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#656D76"></text><text x="670" y="314" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#656D76">region → usd_per_tib rate</text>
  </g>
