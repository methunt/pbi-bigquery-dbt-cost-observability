        stroke="#059669" stroke-width="2" stroke-linecap="round"
        stroke-dasharray="9 15"/>
  <polygon points="366,250 359,245.5 359,254.5" fill="#D0D7DE"/>
  <path d="M580,225 C617.0,225 617.0,225 654,225" fill="none" stroke="#D0D7DE" stroke-width="1.5"/>
  <path class="dash" style="animation-delay:1.0s" d="M580,225 C617.0,225 617.0,225 654,225" fill="none"
        stroke="#0891B2" stroke-width="2" stroke-linecap="round"
        stroke-dasharray="9 15"/>
  <polygon points="654,225 647,220.5 647,229.5" fill="#D0D7DE"/>
  <path d="M890,225 C924.0,225 924.0,225 958,225" fill="none" stroke="#D0D7DE" stroke-width="1.5"/>
