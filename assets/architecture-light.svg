    <rect x="36" y="46" width="250" height="104" rx="10" fill="#F6F8FA"
          stroke="#D0D7DE"/>
    <rect x="36" y="46" width="250" height="3" rx="1.5" fill="#2563EB"/>
    <text x="52" y="74" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13"
          font-weight="600" fill="#1F2328">INFORMATION_SCHEMA</text>
    <text x="52" y="96" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#656D76">JOBS_BY_PROJECT, per region</text><text x="52" y="113" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#656D76">bytes billed · labels · errors</text><text x="52" y="130" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#656D76">one row per job</text><text x="52" y="147" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#656D76">filtered to on-demand jobs</text>
  </g>
  <g class="node">
    <rect x="36" y="176" width="250" height="104" rx="10" fill="#F6F8FA"
          stroke="#D0D7DE"/>
    <rect x="36" y="176" width="250" height="3" rx="1.5" fill="#7C3AED"/>
    <text x="52" y="204" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13"
          font-weight="600" fill="#1F2328">dbt_artifacts</text>
    <text x="52" y="226" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#656D76">model + test executions</text><text x="52" y="243" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#656D76">invocations · models · tags</text><text x="52" y="260" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#656D76">27 models · 14 tests</text><text x="52" y="277" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#656D76">adapter_response → job_id</text>
  </g>
  <g class="node">
    <rect x="36" y="306" width="250" height="88" rx="10" fill="#F6F8FA"
          stroke="#D0D7DE" stroke-dasharray="5 4"/>
    <rect x="36" y="306" width="250" height="3" rx="1.5" fill="#059669"/>
    <text x="52" y="334" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13"
          font-weight="600" fill="#1F2328">sample-data/*.csv</text>
    <text x="52" y="356" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#656D76">the committed synthetic month</text><text x="52" y="373" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#656D76">4,894 jobs · 2026-06-01 to 2026-06-30</text><text x="52" y="390" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#656D76">no cloud account required</text>
  </g>
  <g class="node">
    <rect x="366" y="150" width="214" height="150" rx="10" fill="#F6F8FA"
