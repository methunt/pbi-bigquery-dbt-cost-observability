  <path class="dash" style="animation-delay:0.0s" d="M286,98 C326.0,98 326.0,200 366,200" fill="none"
        stroke="#2563EB" stroke-width="2" stroke-linecap="round"
        stroke-dasharray="9 15"/>
  <polygon points="366,200 359,195.5 359,204.5" fill="#D0D7DE"/>
