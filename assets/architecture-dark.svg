<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-label="How the model is wired, from BigQuery and dbt metadata through to the report pages">
  <style>
    .node { animation: fade .5s ease-out both; }
    .node:nth-of-type(1) { animation-delay:.05s }
    .node:nth-of-type(2) { animation-delay:.12s }
    .node:nth-of-type(3) { animation-delay:.19s }
    .node:nth-of-type(4) { animation-delay:.26s }
    .node:nth-of-type(5) { animation-delay:.33s }
    .node:nth-of-type(6) { animation-delay:.40s }
    .dash { animation: march 1.1s linear infinite; }
    /* Transform only - see the note in the hero. */
    @keyframes fade { from { transform: translateY(8px) }
                       to   { transform: translateY(0) } }
    @keyframes march { from { stroke-dashoffset: 48 } to { stroke-dashoffset: 0 } }
    @media (prefers-reduced-motion: reduce) { .node,.dash { animation: none } }
  </style>
  <rect width="1200" height="430" fill="#0D1117"/>
  <text x="36" y="28" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="600"
        fill="#484F58" letter-spacing="1.4">HOW IT IS WIRED</text>

  <path d="M286,98 C326.0,98 326.0,200 366,200" fill="none" stroke="#30363D" stroke-width="1.5"/>
  <path class="dash" style="animation-delay:0.0s" d="M286,98 C326.0,98 326.0,200 366,200" fill="none"
        stroke="#3B82F6" stroke-width="2" stroke-linecap="round"
        stroke-dasharray="9 15"/>
  <polygon points="366,200 359,195.5 359,204.5" fill="#30363D"/>
  <path d="M286,228 C326.0,228 326.0,225 366,225" fill="none" stroke="#30363D" stroke-width="1.5"/>
  <path class="dash" style="animation-delay:0.35s" d="M286,228 C326.0,228 326.0,225 366,225" fill="none"
        stroke="#8B5CF6" stroke-width="2" stroke-linecap="round"
        stroke-dasharray="9 15"/>
  <polygon points="366,225 359,220.5 359,229.5" fill="#30363D"/>
  <path d="M286,350 C326.0,350 326.0,250 366,250" fill="none" stroke="#30363D" stroke-width="1.5"/>
  <path class="dash" style="animation-delay:0.7s" d="M286,350 C326.0,350 326.0,250 366,250" fill="none"
        stroke="#10B981" stroke-width="2" stroke-linecap="round"
        stroke-dasharray="9 15"/>
  <polygon points="366,250 359,245.5 359,254.5" fill="#30363D"/>
  <path d="M580,225 C617.0,225 617.0,225 654,225" fill="none" stroke="#30363D" stroke-width="1.5"/>
  <path class="dash" style="animation-delay:1.0s" d="M580,225 C617.0,225 617.0,225 654,225" fill="none"
        stroke="#22D3EE" stroke-width="2" stroke-linecap="round"
        stroke-dasharray="9 15"/>
  <polygon points="654,225 647,220.5 647,229.5" fill="#30363D"/>
  <path d="M890,225 C924.0,225 924.0,225 958,225" fill="none" stroke="#30363D" stroke-width="1.5"/>
  <path class="dash" style="animation-delay:1.35s" d="M890,225 C924.0,225 924.0,225 958,225" fill="none"
        stroke="#F59E0B" stroke-width="2" stroke-linecap="round"
        stroke-dasharray="9 15"/>
  <polygon points="958,225 951,220.5 951,229.5" fill="#30363D"/>

  <g class="node">
    <rect x="36" y="46" width="250" height="104" rx="10" fill="#161B22"
          stroke="#30363D"/>
    <rect x="36" y="46" width="250" height="3" rx="1.5" fill="#3B82F6"/>
    <text x="52" y="74" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16"
          font-weight="600" fill="#E6EDF3">INFORMATION_SCHEMA</text>
    <text x="52" y="96" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8B949E">JOBS_BY_PROJECT, per region</text><text x="52" y="113" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8B949E">bytes billed · labels · errors</text><text x="52" y="130" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8B949E">one row per job</text><text x="52" y="147" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8B949E">filtered to on-demand jobs</text>
  </g>
  <g class="node">
    <rect x="36" y="176" width="250" height="104" rx="10" fill="#161B22"
          stroke="#30363D"/>
    <rect x="36" y="176" width="250" height="3" rx="1.5" fill="#8B5CF6"/>
    <text x="52" y="204" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16"
          font-weight="600" fill="#E6EDF3">dbt_artifacts</text>
    <text x="52" y="226" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8B949E">model + test executions</text><text x="52" y="243" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8B949E">invocations · models · tags</text><text x="52" y="260" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8B949E">27 models · 14 tests</text><text x="52" y="277" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8B949E">adapter_response → job_id</text>
  </g>
  <g class="node">
    <rect x="36" y="300" width="250" height="104" rx="10" fill="#161B22"
          stroke="#30363D" stroke-dasharray="5 4"/>
    <rect x="36" y="300" width="250" height="3" rx="1.5" fill="#10B981"/>
    <text x="52" y="328" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16"
          font-weight="600" fill="#E6EDF3">sample-data/*.csv</text>
    <text x="52" y="350" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8B949E">the committed synthetic month</text><text x="52" y="367" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8B949E">4,894 jobs</text><text x="52" y="384" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8B949E">2026-06-01 to 2026-06-30</text><text x="52" y="401" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8B949E">no cloud account required</text>
  </g>
  <g class="node">
    <rect x="366" y="150" width="214" height="150" rx="10" fill="#161B22"
          stroke="#30363D"/>
    <rect x="366" y="150" width="214" height="3" rx="1.5" fill="#22D3EE"/>
    <text x="382" y="178" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16"
          font-weight="600" fill="#E6EDF3">Power Query</text>
    <text x="382" y="200" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8B949E">p_DataSource switches</text><text x="382" y="217" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8B949E">every partition between</text><text x="382" y="234" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8B949E">BigQuery and CSV.</text><text x="382" y="251" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8B949E"></text><text x="382" y="268" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8B949E">Types stated per table -</text><text x="382" y="285" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8B949E">CSV carries none.</text>
  </g>
  <g class="node">
    <rect x="654" y="128" width="236" height="194" rx="10" fill="#161B22"
          stroke="#30363D"/>
    <rect x="654" y="128" width="236" height="3" rx="1.5" fill="#F59E0B"/>
    <text x="670" y="156" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16"
          font-weight="600" fill="#E6EDF3">Semantic model</text>
    <text x="670" y="178" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8B949E">Fact  ← one row per job</text><text x="670" y="195" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8B949E">dbt_node_executions</text><text x="670" y="212" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8B949E">dbt_invocations · dbt_models</text><text x="670" y="229" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8B949E">dim_Date · dim_Region_Cost</text><text x="670" y="246" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8B949E"></text><text x="670" y="263" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8B949E">cost restricted to top-level</text><text x="670" y="280" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8B949E">jobs (parent_job_id BLANK)</text><text x="670" y="297" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8B949E"></text><text x="670" y="314" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8B949E">region → usd_per_tib rate</text>
  </g>
  <g class="node">
    <rect x="958" y="150" width="206" height="150" rx="10" fill="#161B22"
          stroke="#30363D"/>
    <rect x="958" y="150" width="206" height="3" rx="1.5" fill="#10B981"/>
    <text x="974" y="178" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16"
          font-weight="600" fill="#E6EDF3">Report</text>
    <text x="974" y="200" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8B949E">Query &amp; Usage Insights</text><text x="974" y="217" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8B949E">DBT Jobs</text><text x="974" y="234" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8B949E">DBT Jobs · Nodes Failed</text><text x="974" y="251" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8B949E">two Explore tabs</text><text x="974" y="268" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8B949E"></text><text x="974" y="285" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#8B949E">drillthrough + tooltips</text>
  </g>
  <text x="366" y="348" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="15" fill="#484F58">
    p_DataSource = "SampleCSV" | "BigQuery"
  </text>
</svg>
