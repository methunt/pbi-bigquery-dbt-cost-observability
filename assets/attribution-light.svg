<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="How dbt spend is attributed across three branches">
  <style>
    /* The bar's resting width is its real width, and the animation grows into it.
       Written the other way round - base width 0, filled in by the animation - a
       renderer that skips CSS shows three empty tracks. */
    .row { animation: slide .5s ease-out both; }
    .bar { width: var(--w); animation: grow .85s cubic-bezier(.2,.7,.3,1); }
    @keyframes slide { from { transform: translateX(-8px) }
                        to   { transform: translateX(0) } }
    @keyframes grow { from { width: 0 } to { width: var(--w) } }
    @media (prefers-reduced-motion: reduce) {
      .row,.bar { animation: none }
    }
  </style>
  <rect width="1200" height="330" fill="#FFFFFF"/>
  <text x="36" y="34" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600"
        fill="#8C959F" letter-spacing="1.4">WHERE THE dbt BILL COMES FROM</text>
  <text x="36" y="60" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#656D76">
    $470.60 of dbt spend, split by how confidently each job ties back to a node.
  </text>

  <g class="row" style="animation-delay:0.15s">
    <text x="36" y="96" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600"
          fill="#1F2328">Node (dbt metadata)</text>
    <text x="36" y="116" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5"
          fill="#656D76">matched to a recorded node execution by job id</text>
    <rect x="380" y="80" width="640" height="20" rx="5" fill="#E4E8EC"/>
    <rect class="bar" style="animation-delay:0.30s;--w:640px"
          x="380" y="80" height="20" rx="5" fill="#059669"/>
    <text x="1040" y="95" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="13" font-weight="600"
          fill="#1F2328">$380.74</text>
    <text x="1040" y="114" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5"
          fill="#656D76">80.9%  ·  2,577 jobs</text>
  </g>
  <g class="row" style="animation-delay:0.29s">
    <text x="36" y="174" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600"
          fill="#1F2328">Node (label)</text>
    <text x="36" y="194" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5"
          fill="#656D76">post-hook jobs dbt never records - labels are the only route</text>
    <rect x="380" y="158" width="640" height="20" rx="5" fill="#E4E8EC"/>
    <rect class="bar" style="animation-delay:0.44s;--w:151px"
          x="380" y="158" height="20" rx="5" fill="#D97706"/>
    <text x="1040" y="173" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="13" font-weight="600"
          fill="#1F2328">$89.70</text>
    <text x="1040" y="192" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5"
          fill="#656D76">19.1%  ·  161 jobs</text>
  </g>
  <g class="row" style="animation-delay:0.43s">
    <text x="36" y="252" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600"
          fill="#1F2328">Run-level</text>
    <text x="36" y="272" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5"
          fill="#656D76">a dbt run with no identifiable node, e.g. run-operation</text>
    <rect x="380" y="236" width="640" height="20" rx="5" fill="#E4E8EC"/>
    <rect class="bar" style="animation-delay:0.58s;--w:3px"
          x="380" y="236" height="20" rx="5" fill="#8C959F"/>
    <text x="1040" y="251" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="13" font-weight="600"
          fill="#1F2328">$0.16</text>
    <text x="1040" y="270" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="10.5"
          fill="#656D76">0.0%  ·  41 jobs</text>
  </g>
  <rect x="36" y="286" width="1128" height="1" fill="#D0D7DE"/>
  <text x="36" y="312" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#656D76">
    Drop the label branch and $89.70 of the bill - 19.1% - becomes unattributable. That is the case for this model.
  </text>
</svg>
